---
layout: null
---
<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zzsla</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/site.css">
<script defer src="assets/search-index.js"></script>
<script defer src="assets/search.js"></script>
<script defer src="assets/sidebar.js"></script>
<script defer src="assets/graph.js"></script>
<button type="button" class="sidebar-toggle" aria-label="파일 탐색기 열기"
        aria-controls="file-sidebar" aria-expanded="false">
  <span class="sidebar-icon" aria-hidden="true"></span>
</button>
<button type="button" class="graph-toggle" aria-label="그래프 뷰" aria-pressed="false"
        aria-controls="graph-view" hidden>
  <span class="graph-icon" aria-hidden="true"><i></i><i></i><i></i></span>
</button>
<aside id="file-sidebar" class="sidebar" aria-label="파일 탐색기" hidden>
  <nav aria-label="글 목록" class="file-list">
    <p class="empty-files">아직 글이 없어요.</p>
    <ul hidden></ul>
  </nav>
</aside>
<header class="site-brand"><button type="button" class="wordmark" disabled>zzsla</button></header>
<main class="search-home">
  <form role="search" method="get" class="search-box">
    <button type="submit" aria-label="검색"><span class="magnifier" aria-hidden="true"></span></button>
    <input type="search" name="q" aria-label="사이트 글 검색" placeholder="사이트 글 검색" enterkeyhint="search" autocomplete="off" required>
  </form>
  <noscript><p>검색하려면 JavaScript를 켜 주세요.</p></noscript>
  <section class="results" aria-label="검색 결과" hidden>
    <p class="result-count" role="status"></p>
    <ul></ul>
  </section>
</main>
<main id="graph-view" class="graph-view" aria-label="글 연결 그래프" hidden>
  <p class="graph-empty" hidden>표시할 글이 없어요.</p>
  <div class="graph-plot" tabindex="0" aria-label="그래프. 방향키로 이동하고 더하기와 빼기로 확대하거나 축소합니다.">
    <canvas aria-hidden="true"></canvas>
    <div class="graph-nodes"></div>
  </div>
  <div class="graph-menu" hidden>
    <a>글 열기</a>
    <button type="button">이 글 주변만 보기</button>
  </div>
</main>
</html>
